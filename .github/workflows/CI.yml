name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: ubuntu-latest
            python: python3
          - os: macOS-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Use a fixed Python with matplotlib for the PyPlot backend tests instead
      # of PyCall's Conda distribution, which is flaky on ephemeral runners.
      # Note: pin the architecture to x64 since macOS-latest runs x64 Julia
      # under Rosetta on arm64 hardware.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install matplotlib
        run: ${{ matrix.python }} -m pip install matplotlib
      - uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: ${{ matrix.python }}
      - uses: julia-actions/julia-runtest@v1
        env:
          PYTHON: ${{ matrix.python }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info

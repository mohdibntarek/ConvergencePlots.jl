name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Use a fixed Python with matplotlib for the PyPlot backend tests instead
      # of PyCall's Conda distribution, which is flaky on ephemeral runners.
      # Pin the architecture to x64 since macOS-latest runs x64 Julia under
      # Rosetta on arm64 hardware, and resolve the interpreter by absolute path
      # because the runner images also ship a system Python on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install matplotlib and configure PyCall's Python
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python="$pythonLocation/python.exe"
          else
            python="$pythonLocation/bin/python3"
          fi
          "$python" -m pip install matplotlib
          echo "PYTHON=$python" >> "$GITHUB_ENV"
      - name: Remove cached PyCall build state
        shell: bash
        # Delete any cached PyCall deps.jl so it is rebuilt against the Python
        # configured above instead of a stale Conda Python from a previous run.
        run: rm -f "$HOME/.julia/packages/PyCall/"*/deps/deps.jl
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info

name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        include:
          # macOS-latest is an Apple Silicon runner; run native arm64 Julia
          # there. PythonCall's CondaPkg resolves a matching-arm64 Python
          # automatically.
          - os: macOS-latest
            arch: aarch64
            version: '1'
        exclude:
          - os: macOS-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # Builds the package and its extension deps, which also lets CondaPkg
      # download its micromamba-managed Python + matplotlib environment
      # (no preconfigured Python or PyCall is needed).
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
